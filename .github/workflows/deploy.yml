# Deploys app/ to GitHub Pages and names the build (plan.md R6): the page carries the sha of the
# commit this run built, in <meta name="build"> and in the footer. prove.yml is untouched.
name: deploy
run-name: deploy ${{ github.sha }}
on:
  push:
    branches: [main]
    # A take added under media/ is not part of the board: rebuilding would stamp the page with a
    # commit that changed nothing the board runs, and the recording would stop naming its own build.
    paths-ignore: ['media/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the build with the sha this run built
        env:
          BOARD_SESSION: ${{ secrets.BOARD_SESSION }}
        run: |
          node scripts/stamp.mjs --sha "$GITHUB_SHA"
          grep -c "$GITHUB_SHA" app/index.html
          grep -q "export const SESSION = 'v1\." app/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
